[package]
name = "imgbuild"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
toml = "1.2.1"
zstd = { version = "0.14.3", features = ["zstdmt"] }
